---
lint:
  stage: lint
  extends:
    - .rules-branch-manual-MR-and-master-always
  tags:
    - shared-medium
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
  script:
    - !reference [.script-config-git, script]
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3
    - !reference [.script-config-cmake-unix, script]
    - cmake --build $CMAKE_BUILD_DIR --config $CMAKE_BUILD_CONFIG -t go-lib-lint
    - cmake
      --build $CMAKE_BUILD_DIR
      --config $CMAKE_BUILD_CONFIG
      -t clang-format-check

go-vuln-check:
  stage: lint
  extends:
    - .rules-branch-manual-MR-and-master-always
  tags:
    - shared-medium
  script:
    - !reference [.script-config-git, script]
    - !reference [.script-config-cmake-unix, script]
    - bash ci/govulncheck.sh
  artifacts:
    when: always
    paths:
      - go-lib/vulns*