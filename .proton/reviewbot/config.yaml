failOnOutOfDiff: true
scanners:
  golangci-lint:
    enable: false
  gofmt:
    enable: false
  cppcheck:
    enable: true
    ignorePaths:
      - "^vcpkg/"
      - "^lib/tests/"
  shellcheck:
    enable: true
  gomodcheck:
    enable: true
  grype:
    minSeverity: error
    ignorePaths:
      - "^vcpkg/"
    ignoreRules:
      - "GO-2026-5932" # IMEX-132 — x/crypto/openpgp unmaintained-package advisory; no-fix sadly.
    # Convention: each ignored rule gets a JIRA ticket and reason
    #   - "GHSA-xxxx-yyyy"  # IMEX-NNNN — brief reason
